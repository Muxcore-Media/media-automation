name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  release:
    runs-on: self-hosted
    steps:
      - uses: Muxcore-Media/mvp/.github/actions/checkout-mirror@main
        with:
          token: ${{ secrets.MUXCORE_CI_TOKEN || github.token }}
      - name: Checkout dependencies
        env:
          TOKEN: ${{ secrets.MUXCORE_CI_TOKEN || github.token }}
        run: |
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/Muxcore-Media/core.git" core
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/Muxcore-Media/contracts-downloader.git" contracts-downloader
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/Muxcore-Media/contracts-indexer.git" contracts-indexer
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/Muxcore-Media/downloader-native-torrent.git" downloader-native-torrent
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/Muxcore-Media/media-custom-formats.git" media-custom-formats
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/Muxcore-Media/media-movies.git" media-movies
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/Muxcore-Media/media-scanner.git" media-scanner
          git clone --depth 1 "https://x-access-token:${TOKEN}@github.com/Muxcore-Media/media-tvshows.git" media-tvshows
      - name: Prepare workspace layout
        run: |
          mkdir -p media-automation
          shopt -s dotglob
          for item in *; do
            case "$item" in core|contracts-downloader|contracts-indexer|downloader-native-torrent|media-custom-formats|media-movies|media-scanner|media-tvshows|media-automation) continue ;; esac
            mv "$item" media-automation/
          done
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - working-directory: ./media-automation
        run: go build -o media-automation ./cmd/module
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: media-automation/media-automation
